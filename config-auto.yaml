# LORBOL 自动发现配置文件
# 零配置部署 - 无需手动配置peers

# 网络配置（所有节点必须相同）
network:
  name: "auto-network"           # 网络名称 - 可以修改为你的项目名
  cidr: "10.200.0.0/16"         # 虚拟网络段

# 节点配置（会自动生成唯一配置）
node:
  name: ""                      # 留空自动生成：hostname-随机数
  virtual_ip: ""                # 留空自动分配：10.200.X.X
  listen_port: 51820            # UDP监听端口

# 自动发现配置
bootstrap:
  method: "auto"                # 自动发现模式
  config:
    discovery_methods:          # 尝试的发现方法（按顺序）
      - "github"                # GitHub仓库发现（推荐）
      - "dns"                   # DNS TXT记录发现
      - "multicast"             # 本地网络多播发现
    
    # GitHub发现配置（可选）
    github_repo: "your-username/lorbol-nodes"
    github_token: ""            # 可选：GitHub Personal Access Token
    
    # DNS发现配置（可选）
    dns_domain: "nodes.yourdomain.com"
    
    # 更新间隔
    update_interval: 60s

# TUN接口配置  
tun:
  interface_name: "lorbol0"
  mtu: 1420

# 延迟测量配置
latency:
  method: "udp"
  interval: 30s
  timeout: 5s

# 路由优化配置
routing:
  optimize_interval: 60s
  algorithm: "shortest_path"

# 日志配置
logging:
  level: "info"