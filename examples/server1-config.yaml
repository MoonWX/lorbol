server:
  host: "0.0.0.0"
  port: 8080

network:
  name: "lorbol-testnet"
  cidr: "10.100.0.0/16"
  gateway: "10.100.0.1"
  dns_servers:
    - "8.8.8.8"
    - "1.1.1.1"
  domain: "lorbol.local"
  mtu: 1420

node:
  name: "server-1"
  virtual_ip: "10.100.0.2"
  public_ip: ""  # Auto-detect
  private_ip: ""  # Auto-detect
  port: 51820
  auto_detect_ip: true

latency:
  method: "tcp"  # Use TCP for better cloud server compatibility
  interval: 15s
  timeout: 3s
  sample_size: 3
  target_endpoints:
    - "8.8.8.8"
    - "1.1.1.1"

routing:
  algorithm: "dijkstra"
  optimize_interval: 2m
  latency_threshold: 50ms
  max_retries: 3

vpn:
  interface: "lorbol0"
  local_ip: "10.100.0.2"
  remote_ips: []
  port: 51820
  protocol: "udp"
  encryption: "chacha20poly1305"

monitor:
  enabled: true
  metrics_port: 9090
  update_interval: 10s

storage:
  type: "file"
  path: "/var/lib/lorbol/data"
  max_size: 104857600  # 100MB
  retention: 168h      # 7 days