# 服务器2完整配置文件
# 假设：上海服务器，公网IP: 124.124.124.2

server:
  host: "0.0.0.0"          # 监听所有网卡，允许外部连接
  port: 8080               # HTTP管理端口 - 与服务器1相同

network:
  name: "lorbol-testnet"   # 网络名称 - 必须与服务器1相同
  cidr: "10.100.0.0/16"   # 虚拟网络段 - 必须与服务器1相同
  gateway: "10.100.0.1"   # 网关IP - 必须与服务器1相同
  dns_servers:            # DNS服务器 - 与服务器1相同
    - "8.8.8.8"
    - "1.1.1.1"
    - "223.5.5.5"
  domain: "lorbol.local"  # 域名后缀 - 必须与服务器1相同
  mtu: 1420              # MTU大小 - 与服务器1相同

node:
  name: "shanghai-server" # 节点名称 - 必须与服务器1不同
  virtual_ip: "10.100.0.3" # 虚拟IP - 必须与服务器1不同
  public_ip: ""           # 留空自动检测，或填写实际公网IP: "124.124.124.2"
  private_ip: ""          # 留空自动检测
  port: 51821             # P2P通信端口 - 可以与服务器1不同，避免冲突
  auto_detect_ip: true    # 自动检测IP

latency:
  method: "tcp"           # 与服务器1相同
  interval: 15s           # 与服务器1相同
  timeout: 3s             # 与服务器1相同
  sample_size: 3          # 与服务器1相同
  target_endpoints:       # 可以添加不同的测试目标
    - "8.8.8.8"
    - "1.1.1.1"
    - "114.114.114.114"   # 可以用不同的DNS服务器
    # 可以添加服务器1的公网IP: "123.123.123.1"

routing:
  algorithm: "dijkstra"   # 必须与服务器1相同
  optimize_interval: 2m   # 可以与服务器1相同
  latency_threshold: 50ms # 可以与服务器1相同
  max_retries: 3          # 可以与服务器1相同

vpn:
  interface: "lorbol0"    # 与服务器1相同
  local_ip: "10.100.0.3"  # 必须与node.virtual_ip相同，与服务器1不同
  remote_ips: []          # 自动管理，保持空
  port: 51821             # 建议与node.port相同
  protocol: "udp"         # 必须与服务器1相同
  encryption: "chacha20poly1305" # 必须与服务器1相同

monitor:
  enabled: true           # 与服务器1相同
  metrics_port: 9091      # 可以与服务器1不同，避免端口冲突
  update_interval: 10s    # 与服务器1相同

storage:
  type: "file"            # 与服务器1相同
  path: "/var/lib/lorbol/data" # 可以与服务器1相同
  max_size: 104857600     # 与服务器1相同
  retention: 168h         # 与服务器1相同