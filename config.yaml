server:
  host: "localhost"
  port: 8080

latency:
  method: "icmp"
  interval: 30s
  timeout: 5s
  sample_size: 5
  target_endpoints:
    - "8.8.8.8"
    - "1.1.1.1"
    - "208.67.222.222"

routing:
  algorithm: "shortest_latency"
  optimize_interval: 5m
  latency_threshold: 100ms
  max_retries: 3

vpn:
  interface: "tun0"
  local_ip: "10.0.0.1"
  remote_ips:
    - "10.0.0.2"
    - "10.0.0.3"
  port: 1194
  protocol: "udp"
  encryption: "aes256"

monitor:
  enabled: true
  metrics_port: 9090
  update_interval: 10s

storage:
  type: "file"
  path: "./data"
  max_size: 104857600  # 100MB
  retention: 168h      # 7 days